[project]
name = "python-ai-homeworks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "horat", email = "horatiu.deac@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "pydantic>=2.13.5",
]

[project.scripts]
python-ai-homeworks = "python_ai_homeworks:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
